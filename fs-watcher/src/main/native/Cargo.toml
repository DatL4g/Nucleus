[package]
name = "nucleus_fs_watcher"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "nucleus_fs_watcher"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
once_cell = "1.20"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
