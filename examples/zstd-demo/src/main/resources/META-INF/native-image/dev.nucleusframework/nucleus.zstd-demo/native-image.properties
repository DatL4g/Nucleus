# Embed zstd-kmp's bundled native libraries so its loader can extract-and-load them at runtime.
# zstd-kmp's JVM loader reads /jni/<os.arch>/libzstd-kmp.{dylib,so,dll} via getResourceAsStream,
# copies the bytes to a temp file, and System.load()s it. Without this, the resource is absent
# from the image and the loader NPEs on a null stream. The glob covers every shipped arch.
Args = -H:IncludeResources=jni/.*/(libzstd-kmp|zstd-kmp)\.(dylib|so|dll)
