          MISSING=0
          for f in "${EXPECTED[@]}"; do
            if [ -f "$f" ]; then
              echo "OK: $f ($(wc -c < "$f") bytes)"
            else
              echo "MISSING: $f" >&2
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then exit 1; fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Gradle tasks
        run: ./gradlew preMerge --continue

  # Stage-1 offscreen Tao scene tests on the full OS matrix. These tests are
  # headless (CPU-recorded ComposeScene, no display), so plain runners work on
  # all three platforms; the native artifacts are downloaded for the
  # native-load smoke tests, which self-skip when their platform libs are absent.
  tao-tests:
    needs: build-natives
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download decorated-window-tao artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-tao/src/main/resources/nucleus/native/
          pattern: 'decorated-window-tao-*'
          merge-multiple: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Tao scene tests
        run: ./gradlew :decorated-window-tao:test

  # Stage-2 headful suite: real Tao windows in a single event loop per process
  # (taoHeadfulTest JavaExec). macOS/Windows runners have a real graphical
  # session; Linux gets Xvfb + openbox (floating WM, so move/resize/maximize
  # requests behave — the suite still skips the WM-owned-geometry cases there).
  tao-headful:
    needs: build-natives
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download decorated-window-tao artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-tao/src/main/resources/nucleus/native/
          pattern: 'decorated-window-tao-*'
          merge-multiple: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Mesa software OpenGL (Windows)
        if: runner.os == 'Windows'
        # Hosted runners' display adapter exposes no usable WGL context, so
        # the Tao scene host cannot attach. Mesa's llvmpipe opengl32.dll,
        # dropped next to java.exe (first directory in the DLL search order),
        # gives every JVM-launched window a real software GL context.
        uses: f3d-app/install-mesa-windows-action@v1
        with:
          path: C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk\*\x64\bin

      - name: Install display stack (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox mesa-utils libegl1 libgl1-mesa-dri libgtk-3-0

      - name: Run headful suite (Linux, under Xvfb + openbox)
        if: runner.os == 'Linux'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1200x24 &
          for i in $(seq 1 50); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.2; done
          openbox &
          sleep 1
          ./gradlew :decorated-window-tao:taoHeadfulTest

      - name: Run headful suite
        if: runner.os != 'Linux'
        run: ./gradlew :decorated-window-tao:taoHeadfulTest

  # Native accessibility protocol: launches tao-demo on its A11y tab and
  # verifies the OS-level projection from the OUTSIDE, through the same client
  # APIs assistive tech uses — UIA on Windows (hard gate), AT-SPI via pyatspi
  # on Linux (hard gate), the AX client API on macOS (self-skips on runners:
  # AX clients need the TCC Accessibility permission, which CI cannot grant).
  tao-a11y:
    needs: build-natives
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # All three legs are gating. The Windows probe self-skips (exit 0, loud
    # SKIPPED banner) only when the UIA provider is completely unreachable —
    # the hosted-runner limitation (software display adapter, no WGL context,
    # the scene never attaches so there is nothing to project). Any partial
    # exposure with failing assertions is a real regression and fails hard.
    # macOS (AX client — hosted runners are TCC-trusted) and Linux (AT-SPI)
    # verify the full round-trips in CI.
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download decorated-window-tao artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-tao/src/main/resources/nucleus/native/
          pattern: 'decorated-window-tao-*'
          merge-multiple: true

      # tao-demo's build graph pulls these modules' native-build tasks in too;
      # providing the prebuilt artifacts keeps CI from compiling them (the
      # runner lacks the X11 dev headers decorated-window-jni needs).
      - name: Download decorated-window-jni artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-jni/src/main/resources/nucleus/native/
          pattern: 'decorated-window-jni-*'
          merge-multiple: true

      - name: Download decorated-window-core artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-core/src/main/resources/nucleus/native/
          pattern: 'decorated-window-core-*'
          merge-multiple: true

      - name: Download linux-hidpi artifacts
        uses: actions/download-artifact@v4
        with:
          path: linux-hidpi/src/main/resources/nucleus/native/
          pattern: 'linux-hidpi-*'
          merge-multiple: true

      - name: Download graalvm-runtime artifacts
        uses: actions/download-artifact@v4
        with:
          path: graalvm-runtime/src/main/resources/nucleus/native/
          pattern: 'graalvm-runtime-*'
          merge-multiple: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Mesa software OpenGL (Windows)
        if: runner.os == 'Windows'
        # Hosted runners' display adapter exposes no usable WGL context, so
        # the Tao scene host cannot attach. Mesa's llvmpipe opengl32.dll,
        # dropped next to java.exe (first directory in the DLL search order),
        # gives every JVM-launched window a real software GL context.
        uses: f3d-app/install-mesa-windows-action@v1
        with:
          path: C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk\*\x64\bin

      - name: Build tao-demo (so the probe timeout is not spent compiling)
        run: ./gradlew :examples:tao-demo:jar

      - name: Install display + AT-SPI stack (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox mesa-utils libegl1 libgl1-mesa-dri libgtk-3-0 \
            at-spi2-core python3-pyatspi dbus-x11

      - name: Verify AT-SPI projection (Linux)
        if: runner.os == 'Linux'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1200x24 &
          for i in $(seq 1 50); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.2; done
          openbox &
          eval $(dbus-launch --sh-syntax)
          export DBUS_SESSION_BUS_ADDRESS
          # Same switch scripts/a11y-linux-iter.sh flips: without it the a11y
          # bus reports disabled and AccessKit never registers.
          dbus-send --session --dest=org.a11y.Bus --type=method_call --print-reply \
            /org/a11y/bus org.freedesktop.DBus.Properties.Set \
            string:org.a11y.Status string:IsEnabled variant:boolean:true
          NUCLEUS_DEMO_TAB=A11y ./gradlew --no-daemon :examples:tao-demo:run > /tmp/tao-demo.log 2>&1 &
          status=0
          python3 scripts/ci/verify-atspi.py || status=$?
          pkill -f dev.nucleusframework.sampletao.MainKt || true
          exit $status

      - name: Verify UIA projection (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          NUCLEUS_DEMO_TAB=A11y NUCLEUS_A11Y_DEBUG=1 \
            ./gradlew --no-daemon :examples:tao-demo:run > /tmp/tao-demo.log 2>&1 &
          status=0
          pwsh -File scripts/ci/verify-uia.ps1 -Title "Tao Backend Demo" -TimeoutSec 300 || status=$?
          echo "── java processes ──"
          tasklist | grep -i java || true
          echo "── proven dump-uia-tree.ps1 -Process java ──"
          pwsh -File scripts/dump-uia-tree.ps1 -Process java -MaxDepth 5 || true
          echo "── tao-demo full log ($(wc -l < /tmp/tao-demo.log) lines) ──"
          cat /tmp/tao-demo.log || true
          taskkill //F //IM java.exe //T 2>/dev/null || true
          exit $status

      - name: Verify AX projection (macOS, self-skips without TCC trust)
        if: runner.os == 'macOS'
        run: |
          NUCLEUS_DEMO_TAB=A11y ./gradlew --no-daemon :examples:tao-demo:run > /tmp/tao-demo.log 2>&1 &
          for i in $(seq 1 90); do
            APP_PID=$(pgrep -f dev.nucleusframework.sampletao.MainKt || true)
            [ -n "$APP_PID" ] && break
            sleep 2
          done
          if [ -z "$APP_PID" ]; then echo "tao-demo never started"; tail -50 /tmp/tao-demo.log; exit 1; fi
          status=0
          swift scripts/ci/verify-ax.swift "$APP_PID" || status=$?
          pkill -f dev.nucleusframework.sampletao.MainKt || true
          exit $status
