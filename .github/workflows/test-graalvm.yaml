name: Test GraalVM Native Image

on:
  pull_request:
    branches:
      - '*'

concurrency:
  group: test-graalvm-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-natives:
    uses: ./.github/workflows/build-natives.yaml

  graalvm:
    needs: build-natives
    name: GraalVM - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: macOS ARM64
            os: macos-latest
          - name: Windows x64
            os: windows-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download darkmode-detector native artifacts
        uses: actions/download-artifact@v4
        with:
          path: darkmode-detector/src/main/resources/nucleus/native/
          pattern: '*-natives*'
          merge-multiple: true

      - name: Download native-ssl artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-ssl/src/main/resources/nucleus/native/
          pattern: 'ssl-*'
          merge-multiple: true

      - name: Download decorated-window-jbr artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-jbr/src/main/resources/nucleus/native/
          pattern: 'decorated-window-jbr-*'
          merge-multiple: true

      - name: Download decorated-window-jni artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-jni/src/main/resources/nucleus/native/
          pattern: 'decorated-window-jni-*'
          merge-multiple: true

      - name: Download decorated-window-core artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-core/src/main/resources/nucleus/native/
          pattern: 'decorated-window-core-*'
          merge-multiple: true

      - name: Download linux-hidpi artifacts
        uses: actions/download-artifact@v4
        with:
          path: linux-hidpi/src/main/resources/nucleus/native/
          pattern: 'linux-hidpi-*'
          merge-multiple: true

      - name: Download system-color artifacts
        uses: actions/download-artifact@v4
        with:
          path: system-color/src/main/resources/nucleus/native/
          pattern: 'system-color-*'
          merge-multiple: true

      - name: Download energy-manager artifacts
        uses: actions/download-artifact@v4
        with:
          path: energy-manager/src/main/resources/nucleus/native/
          pattern: 'energy-manager-*'
          merge-multiple: true

      - name: Download taskbar-progress artifacts
        uses: actions/download-artifact@v4
        with:
          path: taskbar-progress/src/main/resources/nucleus/native/
          pattern: 'taskbar-progress-*'
          merge-multiple: true

      - name: Download fs-watcher artifacts
        uses: actions/download-artifact@v4
        with:
          path: fs-watcher/src/main/resources/nucleus/native/
          pattern: 'fs-watcher-*'
          merge-multiple: true

      - name: Download notification-macos artifacts
        uses: actions/download-artifact@v4
        with:
          path: notification-macos/src/main/resources/nucleus/native/
          pattern: 'notification-macos*'
          merge-multiple: true

      - name: Download service-management-macos artifacts
        uses: actions/download-artifact@v4
        with:
          path: service-management-macos/src/main/resources/nucleus/native/
          pattern: 'service-management-macos*'
          merge-multiple: true

      - name: Download notification-linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: notification-linux/src/main/resources/nucleus/native/
          pattern: 'notification-linux-*'
          merge-multiple: true

      - name: Download notification-windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: notification-windows/src/main/resources/nucleus/native/
          pattern: 'notification-windows*'
          merge-multiple: true

      - name: Download autolaunch artifacts
        uses: actions/download-artifact@v4
        with:
          path: autolaunch/src/main/resources/nucleus/native/
          pattern: 'autolaunch*'
          merge-multiple: true

      - name: Download launcher-windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: launcher-windows/src/main/resources/nucleus/native/
          pattern: 'launcher-windows*'
          merge-multiple: true

      - name: Download launcher-linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: launcher-linux/src/main/resources/nucleus/native/
          pattern: 'launcher-linux-*'
          merge-multiple: true

      - name: Download launcher-macos artifacts
        uses: actions/download-artifact@v4
        with:
          path: launcher-macos/src/main/resources/nucleus/native/
          pattern: 'launcher-macos*'
          merge-multiple: true

      - name: Download global-hotkey artifacts
        uses: actions/download-artifact@v4
        with:
          path: global-hotkey/src/main/resources/nucleus/native/
          pattern: 'global-hotkey-*'
          merge-multiple: true

      - name: Download menu-macos artifacts
        uses: actions/download-artifact@v4
        with:
          path: menu-macos/src/main/resources/nucleus/native/
          pattern: 'menu-macos*'
          merge-multiple: true

      - name: Download system-info artifacts
        uses: actions/download-artifact@v4
        with:
          path: system-info/src/main/resources/nucleus/native/
          pattern: 'system-info-*'
          merge-multiple: true

      - name: Download scheduler artifacts
        uses: actions/download-artifact@v4
        with:
          path: scheduler/src/main/resources/nucleus/native/
          pattern: 'scheduler-*'
          merge-multiple: true

      - name: Download media-control artifacts
        uses: actions/download-artifact@v4
        with:
          path: media-control/src/main/resources/nucleus/native/
          pattern: 'media-control-*'
          merge-multiple: true

      - name: Download decorated-window-tao artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-tao/src/main/resources/nucleus/native/
          pattern: 'decorated-window-tao-*'
          merge-multiple: true

      - name: Download graalvm-runtime artifacts
        uses: actions/download-artifact@v4
        with:
          path: graalvm-runtime/src/main/resources/nucleus/native/
          pattern: 'graalvm-runtime-*'
          merge-multiple: true

      - name: Setup Nucleus (GraalVM)
        uses: ./.github/actions/setup-nucleus
        with:
          graalvm: 'true'
          setup-gradle: 'true'
          setup-node: 'false'

      - name: Build GraalVM native image
        shell: bash
        run: ./gradlew :examples:nucleus-demo:packageGraalvmNative -PnativeMarch=compatibility --no-daemon --stacktrace

      - name: Upload GraalVM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graalvm-${{ runner.os }}
          path: |
            examples/nucleus-demo/build/compose/tmp/**/graalvm/output/**
          if-no-files-found: warn

  # Runs the Tao test pyramid inside a GraalVM native image on all three OSes:
  # compiles examples/tao-native-test once per OS, then executes the binary
  # twice — `battery` (stage-1 offscreen, headless) and `headful` (stage-2 real
  # windows). This is the only place the produced native binaries are actually
  # RUN in CI, so it also catches missing reachability metadata at runtime.
  tao-native-tests:
    needs: build-natives
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download decorated-window-tao artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-tao/src/main/resources/nucleus/native/
          pattern: 'decorated-window-tao-*'
          merge-multiple: true

      - name: Download graalvm-runtime artifacts
        uses: actions/download-artifact@v4
        with:
          path: graalvm-runtime/src/main/resources/nucleus/native/
          pattern: 'graalvm-runtime-*'
          merge-multiple: true

      - name: Download linux-hidpi artifacts
        uses: actions/download-artifact@v4
        with:
          path: linux-hidpi/src/main/resources/nucleus/native/
          pattern: 'linux-hidpi-*'
          merge-multiple: true

      - name: Setup Nucleus (GraalVM)
        uses: ./.github/actions/setup-nucleus
        with:
          graalvm: 'true'
          setup-gradle: 'true'
          setup-node: 'false'

      - name: Build native test runner
        run: ./gradlew :examples:tao-native-test:packageGraalvmNative -PnativeMarch=compatibility --no-daemon --stacktrace

      - name: Install display stack (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox mesa-utils libegl1 libgl1-mesa-dri libgtk-3-0

      - name: Run native test pyramid (Linux, under Xvfb + openbox)
        if: runner.os == 'Linux'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1200x24 &
          for i in $(seq 1 50); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.2; done
          openbox &
          sleep 1
          BIN=examples/tao-native-test/build/compose/tmp/main/graalvm/nativeCompile/tao-native-test
          "$BIN" battery
          "$BIN" headful

      - name: Run native test pyramid
        if: runner.os != 'Linux'
        shell: bash
        run: |
          BIN=$(find examples/tao-native-test/build/compose/tmp/main/graalvm/nativeCompile -maxdepth 1 -type f -name 'tao-native-test*' | head -1)
          "$BIN" battery
          "$BIN" headful
